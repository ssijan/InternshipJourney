<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #2f3640;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        a.button {
            background: #0984e3;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 6px;
        }

        a.button:hover {
            background: #0652dd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #dfe6e9;
        }

        .actions a {
            margin: 0 5px;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 4px;
            color: white;
        }

        .edit {
            background: #00b894;
        }

        .delete {
            background: #d63031;
        }

        .edit:hover { opacity: 0.8; }
        .delete:hover { opacity: 0.8; }

        .empty {
            text-align: center;
            padding: 20px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student List</h1>

    <div class="top-bar">
        <a class="button" href="{% url 'dashboard' %}">Home</a>
        <a class="button" href="{% url 'student-create' %}">+ Add Student</a>
    </div>

    <table>

        <tr>
            <th>Name</th>
            <th>Department</th>
            <th>CGPA</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.department }}</td>
            <td>{{ student.cgpa }}</td>
            <td class="actions">
                <a class="edit" href="{% url 'student-update' student.id %}">Edit</a>
                <a class="delete" href="{% url 'student-delete' student.id %}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="empty">No students found</td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
