<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #d63031;
        }

        button {
            padding: 12px 20px;
            background: #d63031;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #c0392b;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #2d3436;
        }

        a:hover {
            color: #000;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Delete "{{ object.name }}"?</h2>

    <p>Are you sure you want to delete this student? This action cannot be undone.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>

    <a href="{% url 'student-list' %}">Cancel</a>

</div>

</body>
</html>
